<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — County access</title>
  <meta name="color-scheme" content="dark">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e6edf3;
      margin: 0;
      min-height: 100vh;
    }
    .top {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #30363d;
      background: #161b22;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .top h1 { margin: 0; font-size: 1.25rem; }
    .top a { color: #58a6ff; text-decoration: none; font-size: 0.9rem; margin-left: 0.75rem; }
    .main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    .lead { color: #8b949e; margin: 0 0 1.25rem; }
    .card {
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #161b22;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .card strong { display: block; margin-bottom: 0.25rem; }
    .sub { color: #8b949e; font-size: 0.85rem; }
    .actions { display: flex; gap: 0.5rem; }
    .btn {
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #e6edf3;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-ok { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-no { background: #c05621; border-color: transparent; color: #fff; }
    .err { color: #f85149; }
    .empty { color: #8b949e; }
    #authBar { display: flex; align-items: center; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>County access requests</h1>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
      <a href="/">← USA map</a>
      <div id="authBar"></div>
    </div>
  </div>
  <div class="main">
    <p class="lead">Approve or deny pending USER requests for county data access (browse only).</p>
    <div id="list"></div>
    <div class="err" id="error"></div>
  </div>
  <script src="/auth.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function review(id, action) {
      const res = await PropTaxAuth.authFetch(`/api/admin/county-access/requests/${id}`, {
        method: 'POST',
        body: JSON.stringify({ action }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Update failed');
      await load();
    }

    async function load() {
      const list = document.getElementById('list');
      const res = await PropTaxAuth.authFetch('/api/admin/county-access/requests?status=pending');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load requests');
      const requests = data.requests || [];
      if (!requests.length) {
        list.innerHTML = '<p class="empty">No pending requests.</p>';
        return;
      }
      list.innerHTML = requests.map((r) => `
        <div class="card">
          <div>
            <strong>${escapeHtml(r.state)} / ${escapeHtml(r.county)}</strong>
            <div class="sub">
              ${escapeHtml(r.user.firstName)} ${escapeHtml(r.user.lastName)}
              · ${escapeHtml(r.user.email)}
              ${r.user.mobile ? ' · ' + escapeHtml(r.user.mobile) : ''}
              · ${escapeHtml(r.user.companyName)}
            </div>
            <div class="sub">Requested ${escapeHtml(new Date(r.createdAt).toLocaleString())}</div>
          </div>
          <div class="actions">
            <button class="btn btn-ok" data-id="${r.id}" data-action="approve">Approve</button>
            <button class="btn btn-no" data-id="${r.id}" data-action="deny">Deny</button>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('button[data-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await review(btn.dataset.id, btn.dataset.action);
          } catch (ex) {
            document.getElementById('error').textContent = ex.message || String(ex);
            btn.disabled = false;
          }
        });
      });
    }

    (async () => {
      const me = await PropTaxAuth.requireAdminPage();
      if (!me) return;
      PropTaxAuth.renderAuthBar(document.getElementById('authBar'), me);
      await load();
    })().catch((err) => {
      document.getElementById('error').textContent = err.message || String(err);
    });
  </script>
</body>
</html>
