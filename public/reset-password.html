<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password — Prop Tax Scraper</title>
  <meta name="color-scheme" content="dark">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e6edf3;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.5rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    .lead { color: #8b949e; font-size: 0.9rem; margin: 0 0 1.25rem; }
    label { display: block; font-size: 0.85rem; color: #c9d1d9; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 0.95rem;
      margin-bottom: 0.9rem;
    }
    .btn {
      width: 100%;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: 1px solid #2ea043;
      background: #238636;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn:hover { background: #2ea043; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .links { margin-top: 1rem; font-size: 0.85rem; }
    .links a { color: #58a6ff; text-decoration: none; }
    .msg { color: #3fb950; font-size: 0.85rem; margin: 0 0 0.75rem; }
    .err { color: #f85149; font-size: 0.85rem; margin: 0 0 0.75rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set new password</h1>
    <p class="lead">Choose a new password for your account.</p>
    <div class="err" id="error"></div>
    <div class="msg" id="msg"></div>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" required autocomplete="new-password">
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" minlength="8" required autocomplete="new-password">
      <button class="btn" type="submit" id="submit">Update password</button>
    </form>
    <div class="links"><a href="/login.html">← Back to sign in</a></div>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    if (!token) {
      document.getElementById('error').textContent = 'Missing reset token. Use the link from your email.';
      document.getElementById('form').style.display = 'none';
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submit');
      err.textContent = '';
      msg.textContent = '';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        err.textContent = 'Passwords do not match';
        return;
      }
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Reset failed');
        msg.textContent = 'Password updated. You can sign in now.';
        document.getElementById('form').style.display = 'none';
        setTimeout(() => { window.location.href = '/login.html'; }, 1500);
      } catch (ex) {
        err.textContent = ex.message || String(ex);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
