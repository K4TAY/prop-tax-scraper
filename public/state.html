<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select county — Prop Tax Scraper</title>
  <meta name="color-scheme" content="dark">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e6edf3;
      margin: 0;
      min-height: 100vh;
    }
    .top {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #30363d;
      background: #161b22;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .top h1 { margin: 0; font-size: 1.25rem; }
    .top a { color: #58a6ff; text-decoration: none; font-size: 0.9rem; }
    .top a:hover { text-decoration: underline; }
    .main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    .lead { color: #8b949e; margin: 0 0 1rem; font-size: 0.95rem; }
    .meta { color: #8b949e; font-size: 0.85rem; margin-bottom: 1rem; }
    #tx-map-wrap {
      display: none;
      position: relative;
      max-width: 720px;
      margin: 0 auto 1.5rem;
      background: #161b22;
      border-radius: 12px;
      padding: 0.75rem;
      border: 1px solid #30363d;
    }
    #tx-map-wrap.show { display: block; }
    #tx-map-container { position: relative; width: 100%; }
    .tx-counties-svg { width: 100%; height: auto; display: block; }
    .tx-county {
      fill: #21262d;
      stroke: #8b949e;
      stroke-width: 1;
      cursor: not-allowed;
      transition: fill 0.12s ease, stroke 0.12s ease, stroke-width 0.12s ease;
    }
    .tx-county:not(.available):hover {
      fill: #30363d;
      stroke: #e6edf3;
      stroke-width: 1.6;
    }
    .tx-county.available {
      fill: #1f6feb;
      stroke: #0f1419;
      stroke-width: 0.7;
      cursor: pointer;
    }
    .tx-county.available:hover {
      fill: #388bfd;
      stroke: #ffffff;
      stroke-width: 1.2;
    }
    .tx-county.ready {
      fill: #d4a017;
      stroke: #0f1419;
      stroke-width: 0.7;
      cursor: pointer;
    }
    .tx-county.ready:hover {
      fill: #e3b341;
      stroke: #ffffff;
      stroke-width: 1.2;
    }
    .tx-county.imported {
      fill: #238636;
      stroke: #0f1419;
      stroke-width: 0.7;
      cursor: pointer;
    }
    .tx-county.imported:hover {
      fill: #2ea043;
      stroke: #ffffff;
      stroke-width: 1.2;
    }
    .tx-map-tip {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      background: #0d1117;
      border: 1px solid #484f58;
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      font-size: 0.8rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      max-width: 16rem;
    }
    .tx-map-tip strong { color: #e6edf3; font-weight: 600; }
    .tx-map-tip span { color: #8b949e; font-size: 0.72rem; }
    .legend {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #8b949e;
      margin: 0.85rem 0 0;
      justify-content: center;
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 2px;
      margin-right: 0.4rem;
      vertical-align: -1px;
    }
    .legend .imported::before { background: #238636; }
    .legend .ready::before { background: #d4a017; }
    .legend .catalog::before { background: #1f6feb; }
    .legend .none::before { background: #21262d; box-shadow: inset 0 0 0 1px #8b949e; }
    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8b949e;
      margin: 0 0 0.65rem;
    }
    .list { display: flex; flex-direction: column; gap: 0.5rem; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #161b22;
      text-decoration: none;
      color: inherit;
    }
    .row:hover { border-color: #58a6ff; }
    .row.complete {
      border-color: #2ea043;
      background: linear-gradient(90deg, #14331c 0%, #122418 12%, #101a12 100%);
      box-shadow: inset 4px 0 0 #2ea043;
    }
    .row.complete:hover {
      border-color: #3fb950;
      background: linear-gradient(90deg, #194022 0%, #162b1c 12%, #121e14 100%);
    }
    .row.incomplete {
      border-color: #d4a017;
      background: linear-gradient(90deg, #3d2e10 0%, #2a2410 12%, #1c1a10 100%);
      box-shadow: inset 4px 0 0 #d4a017;
    }
    .row.incomplete:hover {
      border-color: #e3b341;
      background: linear-gradient(90deg, #4a3814 0%, #322c14 12%, #221e12 100%);
    }
    .row.not-processed {
      border-color: #f85149;
      background: linear-gradient(90deg, #3d1515 0%, #2a1414 12%, #1c1212 100%);
      box-shadow: inset 4px 0 0 #f85149;
    }
    .row.not-processed:hover {
      border-color: #ff7b72;
      background: linear-gradient(90deg, #4a1a1a 0%, #321818 12%, #221414 100%);
    }
    .row strong { font-size: 1rem; }
    .row .sub { color: #8b949e; font-size: 0.8rem; margin-top: 0.2rem; }
    .row .stats {
      color: #c9d1d9;
      font-size: 0.8rem;
      margin-top: 0.35rem;
      font-variant-numeric: tabular-nums;
    }
    .row .stats .muted { color: #8b949e; }
    .row .stats .warn { color: #e3b341; font-weight: 600; }
    .row .stats .ok { color: #3fb950; }
    .badge {
      font-size: 0.72rem;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #30363d;
      color: #c9d1d9;
      white-space: nowrap;
    }
    .badge.imported { background: #23863633; border-color: #2ea043; color: #3fb950; }
    .badge.incomplete { background: #d4a01733; border-color: #d4a017; color: #e3b341; font-weight: 600; }
    .badge.not-processed { background: #f8514933; border-color: #f85149; color: #ff7b72; font-weight: 600; }
    .badge.ready { background: #d4a01733; border-color: #d4a017; color: #e3b341; }
    .badge.soon { background: #21262d; color: #8b949e; }
    .err { color: #f85149; }
  </style>
</head>
<body>
  <div class="top">
    <h1 id="title">State</h1>
    <a href="/">← USA map</a>
  </div>
  <div class="main">
    <p class="lead" id="lead">Open a county portal. Each county uses its own Postgres tables and data folders.</p>
    <div class="meta" id="meta"></div>

    <div id="tx-map-wrap">
      <div id="tx-map-container"></div>
      <div class="legend">
        <span class="imported">Fully imported</span>
        <span class="ready">Scrape ready</span>
        <span class="catalog">In CAD catalog</span>
        <span class="none">No source yet</span>
      </div>
    </div>

    <div class="section-label" id="listLabel">Counties</div>
    <div class="list" id="list"></div>
    <div class="err" id="error"></div>
  </div>
  <script src="/texas-counties-map.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const state = (params.get('state') || '').trim().toUpperCase();

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatCount(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return '0';
      return v.toLocaleString('en-US');
    }

    function importStatsHtml(c) {
      const props = Number(c.propertyCount) || 0;
      const unique = Number(c.uniqueParcelCount) || 0;
      const hoods = Number(c.neighborhoodCount) || 0;
      const discovered = Number(c.discoveredNeighborhoodCount) || 0;
      const processed = Number(c.processedCsvCount) || 0;
      const pending = Number(c.pendingCsvCount) || 0;
      const unassigned = Number(c.unassignedCount) || 0;
      if (props === 0 && hoods === 0 && pending === 0 && processed === 0) {
        return '<div class="stats"><span class="muted">No data imported yet</span></div>';
      }
      let html = `<div class="stats">${formatCount(unique)} unique parcels · ${formatCount(props)} records · ${formatCount(hoods)} imported hoods`;
      if (discovered > 0 && discovered !== hoods) {
        html += ` · <span class="warn">${formatCount(hoods)}/${formatCount(discovered)} discovered</span>`;
      }
      if (processed !== hoods) {
        html += ` · <span class="warn">${formatCount(processed)} processed CSV</span>`;
      }
      if (unassigned > 0) {
        html += ` · <span class="ok">${formatCount(unassigned)} unassigned</span>`;
      } else if (props > 0) {
        html += ` · <span class="warn">missing unassigned</span>`;
      }
      if (pending > 0) {
        html += ` · <span class="muted">${formatCount(pending)} CSV pending</span>`;
      }
      html += '</div>';
      return html;
    }

    function portalBySlug(counties) {
      const map = new Map();
      for (const c of counties) map.set(c.slug, c.portalPath);
      return map;
    }

    async function init() {
      if (!/^[A-Z]{2}$/.test(state)) {
        document.getElementById('error').textContent = 'Missing or invalid ?state=XX';
        return;
      }
      document.getElementById('title').textContent = `${state} counties`;
      document.title = `${state} counties — Prop Tax Scraper`;

      const res = await fetch(`/api/cad-sources?state=${encodeURIComponent(state)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load counties');

      const counties = data.counties || [];
      const importedCount = counties.filter((c) => c.importComplete).length;
      const propTotal = counties.reduce((sum, c) => sum + (Number(c.propertyCount) || 0), 0);
      const uniqueTotal = counties.reduce((sum, c) => sum + (Number(c.uniqueParcelCount) || 0), 0);
      document.getElementById('meta').textContent =
        `${counties.length} counties in catalog · ${importedCount} fully imported · ${formatCount(uniqueTotal)} unique parcels · ${formatCount(propTotal)} records in DB`;

      if (state === 'TX') {
        document.getElementById('lead').textContent =
          'Click a highlighted county on the map, or use the list below. Green = fully imported; gold = scrape ready; blue = in catalog.';
        document.getElementById('tx-map-wrap').classList.add('show');
        document.getElementById('listLabel').textContent = 'All catalog counties';

        const availableSlugs = counties.map((c) => c.slug);
        const readySlugs = counties
          .filter((c) => c.scrape_strategy === 'arcgis_rest')
          .map((c) => c.slug);
        const importedSlugs = counties
          .filter((c) => c.importComplete)
          .map((c) => c.slug);
        const statsBySlug = Object.fromEntries(
          counties.map((c) => [c.slug, {
            propertyCount: c.propertyCount,
            uniqueParcelCount: c.uniqueParcelCount,
            nullParcelIdCount: c.nullParcelIdCount,
            unassignedCount: c.unassignedCount,
            neighborhoodCount: c.neighborhoodCount,
            discoveredNeighborhoodCount: c.discoveredNeighborhoodCount,
            processedCsvCount: c.processedCsvCount,
            pendingCsvCount: c.pendingCsvCount,
            importComplete: c.importComplete,
          }])
        );
        const portals = portalBySlug(counties);

        const map = new TexasCountiesMap('tx-map-container', {
          availableSlugs,
          readySlugs,
          importedSlugs,
          statsBySlug,
          onCountyClick: (county) => {
            const href = portals.get(county.slug);
            if (href) window.location.href = href;
          },
        });
        await map.load('/geo/texas-counties.json');
      }

      const list = document.getElementById('list');
      if (!counties.length) {
        list.innerHTML = '<p class="lead">No counties found for this state.</p>';
        return;
      }

      const byName = (a, b) =>
        String(a.county_name || a.slug).localeCompare(String(b.county_name || b.slug), undefined, {
          sensitivity: 'base',
        });
      const isIncompleteCard = (c) =>
        c.scrape_strategy === 'arcgis_rest' && !c.importComplete;
      const sorted = [...counties].sort((a, b) => {
        const aInc = isIncompleteCard(a) ? 0 : 1;
        const bInc = isIncompleteCard(b) ? 0 : 1;
        if (aInc !== bInc) return aInc - bInc;
        return byName(a, b);
      });

      list.innerHTML = sorted.map((c) => {
        const ready = c.scrape_strategy === 'arcgis_rest';
        const incomplete = ready && !c.importComplete;
        const props = Number(c.propertyCount) || 0;
        const pending = Number(c.pendingCsvCount) || 0;
        let badge;
        let rowClass = 'row';
        if (c.importComplete) {
          badge = '<span class="badge imported">fully imported</span>';
          rowClass += ' complete';
        } else if (incomplete) {
          if (props > 0 || pending > 0) {
            rowClass += ' incomplete';
            badge = '<span class="badge incomplete">incomplete</span>';
          } else {
            rowClass += ' not-processed';
            badge = '<span class="badge not-processed">not processed</span>';
          }
        } else if (ready) {
          badge = '<span class="badge ready">scrape ready</span>';
        } else {
          badge = `<span class="badge soon">${escapeHtml(c.scrape_strategy || 'investigate')}</span>`;
        }
        return `
          <a class="${rowClass}" href="${escapeHtml(c.portalPath)}" id="county-${escapeHtml(c.slug)}">
            <div>
              <strong>${escapeHtml(c.county_name)}</strong>
              <div class="sub">${escapeHtml(c.slug)} · tables ${escapeHtml(c.slug)}_${escapeHtml(String(c.state_code).trim().toLowerCase())}_*</div>
              ${importStatsHtml(c)}
            </div>
            ${badge}
          </a>`;
      }).join('');
    }

    init().catch((err) => {
      document.getElementById('error').textContent = err.message || String(err);
    });
  </script>
</body>
</html>
