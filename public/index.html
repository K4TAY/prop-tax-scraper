<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Tax Scraper — Select a state</title>
  <meta name="color-scheme" content="dark">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e6edf3;
      margin: 0;
      min-height: 100vh;
    }
    .top {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #30363d;
      background: #161b22;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .top h1 { margin: 0; font-size: 1.25rem; }
    .top .version { color: #8b949e; font-size: 0.85rem; font-family: ui-monospace, monospace; }
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .lead {
      color: #8b949e;
      font-size: 0.95rem;
      margin: 0 0 1.25rem;
      max-width: 40rem;
    }
    #usa-map-container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: #161b22;
      border-radius: 12px;
      padding: 0.75rem;
      border: 1px solid #30363d;
    }
    #usa-map-container svg { width: 100%; height: auto; display: block; }
    .usa-map-state {
      fill: #30363d !important;
      stroke: #0f1419;
      stroke-width: 1;
      cursor: not-allowed;
      transition: all 0.15s ease;
    }
    .usa-map-state.available {
      fill: #238636 !important;
      cursor: pointer;
    }
    .usa-map-state.available:hover {
      fill: #2ea043 !important;
      stroke: #ffffff;
      stroke-width: 2;
    }
    .usa-map-state-label {
      pointer-events: none;
      font-size: 10px;
      font-weight: bold;
      fill: #c9d1d9 !important;
      text-anchor: middle;
    }
    .legend {
      margin-top: 1rem;
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #8b949e;
    }
    .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      margin-right: 0.35rem;
      vertical-align: -1px;
    }
    .err { color: #f85149; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Property tax data portals</h1>
    <span class="version" id="version"></span>
  </div>
  <div class="main">
    <p class="lead">
      Click a highlighted state to see counties with Harris Govern / True Automation PACS sources.
      Each county has its own portal and database tables.
    </p>
    <div id="usa-map-container"></div>
    <div class="legend">
      <span><span class="swatch" style="background:#238636"></span> Has county sources</span>
      <span><span class="swatch" style="background:#30363d"></span> No sources yet</span>
    </div>
    <div class="err" id="error" style="display:none;"></div>
  </div>
  <script src="/usa-map-select.js"></script>
  <script>
    const available = new Set();

    function showError(msg) {
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.textContent = msg;
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    function highlightAvailable() {
      document.querySelectorAll('#usa-map-container .usa-map-state-group').forEach((g) => {
        const code = g.getAttribute('data-state-code');
        const path = g.querySelector('.usa-map-state');
        if (!path || !code) return;
        if (available.has(code)) path.classList.add('available');
        else path.classList.remove('available');
      });
    }

    async function init() {
      const ver = await fetch('/api/version').then((r) => r.json()).catch(() => ({}));
      if (ver.version) document.getElementById('version').textContent = `v${ver.version}`;

      const data = await fetch('/api/cad-sources/states').then((r) => r.json());
      for (const s of data.states || []) {
        if (s.countyCount > 0) available.add(String(s.state).trim().toUpperCase());
      }

      new USAMapSelect('usa-map-container', {
        showStateNameOnHover: true,
        stateColor: '#30363d',
        stateOnHoverColor: '#2ea043',
        stateOnHoverStrokeColor: '#ffffff',
        stateTextColor: '#c9d1d9',
        onStateClick: ({ stateCode, stateName }) => {
          if (!available.has(stateCode)) {
            showError(`No CAD sources listed for ${stateName} yet.`);
            return;
          }
          window.location.href = `/state.html?state=${encodeURIComponent(stateCode)}`;
        },
      });

      highlightAvailable();
      // Re-apply after map paints inline fills
      setTimeout(highlightAvailable, 0);
    }

    init().catch((err) => showError(err.message || String(err)));
  </script>
</body>
</html>
