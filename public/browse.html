<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse properties</title>
  <meta name="color-scheme" content="dark">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e6edf3;
      margin: 0;
      min-height: 100vh;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #30363d;
      background: #161b22;
      flex-wrap: wrap;
    }
    .top h1 { margin: 0; font-size: 1.15rem; }
    .top a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .top a:hover { text-decoration: underline; }
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: calc(100vh - 58px);
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      border-right: 1px solid #30363d;
      background: #161b22;
      padding: 1rem;
      overflow: auto;
      max-height: calc(100vh - 58px);
    }
    .main {
      padding: 1rem 1.25rem;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8b949e;
      margin: 0.75rem 0 0.45rem;
    }
    .section-label:first-child { margin-top: 0; }
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem 0.5rem;
      max-height: 220px;
      overflow: auto;
      padding: 0.4rem;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
    }
    .cols label {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      font-size: 0.78rem;
      color: #c9d1d9;
    }
    .filters { display: flex; flex-direction: column; gap: 0.45rem; }
    .filter-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.3rem;
      padding: 0.5rem;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
    }
    .filter-row .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.3rem;
    }
    select, input, button {
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #e6edf3;
      font-size: 0.85rem;
    }
    button { cursor: pointer; }
    button.primary { background: #238636; border-color: #2ea043; color: #fff; }
    button.primary:hover { background: #2ea043; }
    button.ghost { background: transparent; }
    button.danger { background: #2a1215; color: #f85149; border-color: #da3633; }
    .actions { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.75rem; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      color: #8b949e;
      font-size: 0.85rem;
    }
    .meta strong { color: #e6edf3; }
    .err { color: #f85149; font-size: 0.9rem; }
    .legends {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-bottom: 1px solid #30363d;
      background: #0d1117;
    }
    @media (max-width: 1100px) {
      .legends { grid-template-columns: 1fr; }
    }
    .legend {
      margin: 0;
      padding: 0.75rem 1.25rem 0.9rem;
      min-width: 0;
    }
    .legend + .legend {
      border-left: 1px solid #30363d;
    }
    @media (max-width: 1100px) {
      .legend + .legend {
        border-left: none;
        border-top: 1px solid #30363d;
      }
    }
    .legend-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.55rem;
      flex-wrap: wrap;
    }
    .legend-head strong {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8b949e;
      font-weight: 600;
    }
    .legend-head span {
      font-size: 0.75rem;
      color: #6e7681;
    }
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.35rem 1rem;
    }
    .legend-item {
      display: grid;
      grid-template-columns: 4.5rem 1fr;
      gap: 0.45rem;
      align-items: baseline;
      font-size: 0.78rem;
      line-height: 1.35;
    }
    .legend-item code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      color: #79c0ff;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 0.1rem 0.35rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .legend-item code:hover {
      border-color: #58a6ff;
      background: #1f2a36;
    }
    .legend-item code.active {
      color: #0d1117;
      background: #58a6ff;
      border-color: #58a6ff;
      font-weight: 600;
    }
    .legend-item span { color: #c9d1d9; }
    .legend-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .legend-active {
      font-size: 0.75rem;
      color: #c9d1d9;
    }
    .legend-active strong { color: #e6edf3; }
    .table-wrap {
      overflow: auto;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #161b22;
      max-height: calc(100vh - 280px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    th, td {
      padding: 0.55rem 0.7rem;
      border-bottom: 1px solid #30363d;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      position: sticky;
      top: 0;
      background: #0d1117;
      color: #c9d1d9;
      z-index: 1;
      cursor: pointer;
      user-select: none;
    }
    th:hover { color: #58a6ff; }
    td.wrap { white-space: normal; max-width: 360px; }
    td a.map-link {
      color: #58a6ff;
      text-decoration: none;
    }
    td a.map-link:hover { text-decoration: underline; }
    .pager { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .pager button:disabled { opacity: 0.45; cursor: not-allowed; }
    .empty { padding: 2rem; text-align: center; color: #8b949e; }
    #authBar { display: flex; align-items: center; }
  </style>
</head>
<body>
  <div class="top">
    <h1 id="pageTitle">Browse properties <span id="version" style="color:#8b949e;font-size:0.85rem;font-weight:400;"></span></h1>
    <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
      <a id="backLink" href="/">← Counties</a>
      <div id="authBar"></div>
    </div>
  </div>

  <div class="legends">
    <section class="legend" aria-label="Exemption code legend">
      <div class="legend-head">
        <strong>Exemption codes</strong>
        <div class="legend-actions">
          <span class="legend-active" id="legendActiveSummary">Click a code to filter</span>
          <button type="button" class="ghost" id="btnClearExemptions" onclick="clearExemptionFilters()" disabled>Clear</button>
        </div>
      </div>
      <div class="legend-grid" id="exemptionLegend"></div>
    </section>
    <section class="legend" aria-label="State code legend">
      <div class="legend-head">
        <strong>State codes</strong>
        <div class="legend-actions">
          <span class="legend-active" id="stateLegendActiveSummary">Click a code to filter</span>
          <button type="button" class="ghost" id="btnClearStateCodes" onclick="clearStateCodeFilters()" disabled>Clear</button>
        </div>
      </div>
      <div class="legend-grid" id="stateCodeLegend"></div>
    </section>
  </div>

  <div class="layout">
    <aside class="panel">
      <div class="section-label">Columns</div>
      <div class="cols" id="columnList"></div>
      <div style="display:flex;gap:0.4rem;margin-top:0.4rem;">
        <button type="button" class="ghost" onclick="selectDefaultColumns()">Defaults</button>
        <button type="button" class="ghost" onclick="selectAllColumns(true)">All</button>
        <button type="button" class="ghost" onclick="selectAllColumns(false)">None</button>
      </div>

      <div class="section-label">Filters</div>
      <div class="filters" id="filterList"></div>
      <button type="button" class="ghost" onclick="addFilterRow()" style="margin-top:0.4rem;width:100%;">+ Add filter</button>

      <div class="section-label">Page size</div>
      <select id="pageSize" aria-label="Records per page">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="250">250</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>

      <div class="actions">
        <button type="button" class="primary" onclick="runSearch(0)">Search</button>
        <button type="button" class="ghost" onclick="clearFilters()">Clear filters</button>
      </div>
    </aside>

    <main class="main">
      <div class="meta">
        <span>Showing <strong id="shownCount">0</strong> of <strong id="totalCount">0</strong></span>
        <span id="pageInfo"></span>
        <div class="pager">
          <button type="button" id="btnPrev" onclick="prevPage()" disabled>← Prev</button>
          <button type="button" id="btnNext" onclick="nextPage()" disabled>Next →</button>
        </div>
      </div>
      <div class="err" id="error" style="display:none;"></div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody">
            <tr><td class="empty" colspan="20">Choose columns / filters and click Search.</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/auth.js"></script>
  <script>
    const OPS = [
      { value: 'ilike', label: 'contains' },
      { value: 'not_ilike', label: 'does not contain' },
      { value: 'eq', label: '=' },
      { value: 'neq', label: '≠' },
      { value: 'gt', label: '>' },
      { value: 'gte', label: '≥' },
      { value: 'lt', label: '<' },
      { value: 'lte', label: '≤' },
      { value: 'like', label: 'like' },
      { value: 'in', label: 'in (csv)' },
      { value: 'has_token', label: 'has code' },
      { value: 'is_null', label: 'is empty' },
      { value: 'not_null', label: 'not empty' },
    ];

    /** Codes seen in this dataset + standard Texas CAD / TrueAutomation meanings. */
    const EXEMPTION_LEGEND = [
      { code: 'HS', label: 'Residence homestead' },
      { code: 'DP', label: 'Disabled person' },
      { code: 'DPS', label: 'Disabled person — surviving spouse' },
      { code: 'DV1', label: 'Disabled veteran 10–29%' },
      { code: 'DV1S', label: 'Disabled veteran 10–29% — surviving spouse' },
      { code: 'DV2', label: 'Disabled veteran 30–49%' },
      { code: 'DV2S', label: 'Disabled veteran 30–49% — surviving spouse' },
      { code: 'DV3', label: 'Disabled veteran 50–69%' },
      { code: 'DV3S', label: 'Disabled veteran 50–69% — surviving spouse' },
      { code: 'DV4', label: 'Disabled veteran 70–100%' },
      { code: 'DV4S', label: 'Disabled veteran 70–100% — surviving spouse' },
      { code: 'DVHS', label: '100% disabled veteran homestead' },
      { code: 'DVHSS', label: '100% disabled veteran homestead — surviving spouse' },
      { code: 'HT', label: 'Historical' },
      { code: 'PC', label: 'Pollution control' },
      { code: 'CHODO', label: 'Community Housing Development Organization' },
      { code: 'LIH', label: 'Public property for housing indigent persons' },
      { code: 'FRSS', label: 'First responder — surviving spouse' },
      { code: 'MASSS', label: 'Member of armed services — surviving spouse' },
      { code: 'QVSS', label: 'Qualified veteran — surviving spouse' },
      { code: 'CCF', label: 'Charitable / community facility (CAD code)' },
      { code: 'OTHER', label: 'Other exemption (CAD catch-all)' },
      { code: 'EX-XD', label: '§11.181 Housing improved with volunteer labor' },
      { code: 'EX-XG', label: '§11.184 Primarily charitable functions' },
      { code: 'EX-XI', label: '§11.19 Youth development organizations' },
      { code: 'EX-XJ', label: '§11.21 Private schools' },
      { code: 'EX-XR', label: '§11.23 Miscellaneous organizations' },
      { code: 'EX-XU', label: '§11.30 Nonprofit water supply / wastewater' },
      { code: 'EX-XV', label: 'Other exempt (public, religious, charitable, etc.)' },
    ];

    /**
     * PTD / CAD state category codes present in scraped county data.
     * Labels follow Texas Comptroller property classification + common CAD subcodes.
     */
    const STATE_CODE_LEGEND = [
      { code: 'A', label: 'Real — single-family residential (category)' },
      { code: 'A1', label: 'Real — residential, single-family' },
      { code: 'A2', label: 'Real — residential, mobile home on owner land' },
      { code: 'A3', label: 'Real — residential, condominiums' },
      { code: 'B1', label: 'Real — residential, multi-family' },
      { code: 'B2', label: 'Real — residential, two-family / duplex' },
      { code: 'B6', label: 'Real — residential, multi-family (CAD B6)' },
      { code: 'C', label: 'Real — vacant lots / tracts (category)' },
      { code: 'C1', label: 'Real — vacant lots and land tracts' },
      { code: 'D1', label: 'Real — qualified open-space / agricultural land' },
      { code: 'D2', label: 'Real — farm/ranch improvements on qualified open-space' },
      { code: 'E1', label: 'Real — rural land / farm & ranch improvements (non-qualified)' },
      { code: 'E2', label: 'Real — mobile homes on rural land' },
      { code: 'F1', label: 'Real — commercial' },
      { code: 'F2', label: 'Real — industrial / manufacturing' },
      { code: 'F3', label: 'Real — commercial (CAD F3)' },
      { code: 'G1', label: 'Real — oil, gas, and mineral reserves' },
      { code: 'J4', label: 'Utility — telephone companies' },
      { code: 'J5', label: 'Utility — railroads' },
      { code: 'J7', label: 'Utility — radio, TV, and cable' },
      { code: 'M1', label: 'Personal — mobile home (land owned by someone else)' },
      { code: 'O1', label: 'Real — residential inventory' },
      { code: 'O2', label: 'Real — inventory (CAD O2)' },
      { code: 'X', label: 'Totally exempt property' },
    ];

    let fieldMeta = [];
    let sort = 'pacs_prop_id';
    let order = 'asc';
    let offset = 0;
    let total = 0;
    let lastFields = [];
    /** @type {Set<string>} */
    const selectedExemptionCodes = new Set();
    /** @type {Set<string>} */
    const selectedStateCodes = new Set();

    const pathMatch = location.pathname.match(/^\/c\/([a-z]{2})\/([a-z0-9_]+)\/browse\/?/i);
    if (!pathMatch) {
      window.location.href = '/c/tx/bexar/browse';
    }
    const STATE = pathMatch[1].toLowerCase();
    const COUNTY = pathMatch[2].toLowerCase();
    const API = `/api/c/${STATE}/${COUNTY}`;
    document.getElementById('backLink').href = `/state.html?state=${STATE.toUpperCase()}`;
    document.title = `Browse — ${COUNTY} (${STATE.toUpperCase()})`;

    const STORAGE_COLS = `propTaxBrowseCols_${STATE}_${COUNTY}`;
    const COLS_COOKIE_MAX_AGE = 60 * 60 * 24 * 365; // 1 year

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getCookie(name) {
      const prefix = `${encodeURIComponent(name)}=`;
      for (const part of document.cookie.split(';')) {
        const s = part.trim();
        if (s.startsWith(prefix)) {
          try {
            return decodeURIComponent(s.slice(prefix.length));
          } catch {
            return s.slice(prefix.length);
          }
        }
      }
      return null;
    }

    function setCookie(name, value, maxAgeSec = COLS_COOKIE_MAX_AGE) {
      const encoded = encodeURIComponent(value);
      document.cookie = `${encodeURIComponent(name)}=${encoded}; path=/; max-age=${maxAgeSec}; SameSite=Lax`;
    }

    function loadSavedColumns() {
      const fromCookie = safeParse(getCookie(STORAGE_COLS));
      if (Array.isArray(fromCookie) && fromCookie.length) return fromCookie;
      // One-time migrate from older localStorage preference.
      try {
        const fromLs = safeParse(localStorage.getItem(STORAGE_COLS));
        if (Array.isArray(fromLs) && fromLs.length) {
          saveColumns(fromLs);
          localStorage.removeItem(STORAGE_COLS);
          return fromLs;
        }
      } catch {
        /* ignore */
      }
      return null;
    }

    function saveColumns(fields) {
      const list = Array.isArray(fields) ? fields.filter(Boolean) : [];
      if (!list.length) return;
      setCookie(STORAGE_COLS, JSON.stringify(list));
    }

    function renderExemptionLegend() {
      const el = document.getElementById('exemptionLegend');
      el.innerHTML = EXEMPTION_LEGEND.map(({ code, label }) =>
        `<div class="legend-item">
          <code role="button" tabindex="0" data-code="${escapeHtml(code)}" title="Filter by ${escapeHtml(code)}">${escapeHtml(code)}</code>
          <span>${escapeHtml(label)}</span>
        </div>`
      ).join('');
      el.querySelectorAll('code[data-code]').forEach((btn) => {
        const activate = () => addExemptionFilter(btn.getAttribute('data-code'));
        btn.addEventListener('click', activate);
        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            activate();
          }
        });
      });
      syncLegendActive();
    }

    function renderStateCodeLegend() {
      const el = document.getElementById('stateCodeLegend');
      el.innerHTML = STATE_CODE_LEGEND.map(({ code, label }) =>
        `<div class="legend-item">
          <code role="button" tabindex="0" data-code="${escapeHtml(code)}" title="Filter by ${escapeHtml(code)}">${escapeHtml(code)}</code>
          <span>${escapeHtml(label)}</span>
        </div>`
      ).join('');
      el.querySelectorAll('code[data-code]').forEach((btn) => {
        const activate = () => addStateCodeFilter(btn.getAttribute('data-code'));
        btn.addEventListener('click', activate);
        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            activate();
          }
        });
      });
      syncStateLegendActive();
    }

    function syncLegendActive() {
      document.querySelectorAll('#exemptionLegend code[data-code]').forEach((el) => {
        const code = el.getAttribute('data-code');
        el.classList.toggle('active', selectedExemptionCodes.has(code));
      });
      const summary = document.getElementById('legendActiveSummary');
      const clearBtn = document.getElementById('btnClearExemptions');
      const codes = [...selectedExemptionCodes];
      if (!codes.length) {
        summary.textContent = 'Click a code to filter (multi-select)';
      } else {
        summary.innerHTML = `Filtering: <strong>${escapeHtml(codes.join(' + '))}</strong>`;
      }
      clearBtn.disabled = codes.length === 0;
    }

    function syncStateLegendActive() {
      document.querySelectorAll('#stateCodeLegend code[data-code]').forEach((el) => {
        const code = el.getAttribute('data-code');
        el.classList.toggle('active', selectedStateCodes.has(code));
      });
      const summary = document.getElementById('stateLegendActiveSummary');
      const clearBtn = document.getElementById('btnClearStateCodes');
      const codes = [...selectedStateCodes];
      if (!codes.length) {
        summary.textContent = 'Click a code to filter (multi-select)';
      } else {
        summary.innerHTML = `Filtering: <strong>${escapeHtml(codes.join(', '))}</strong>`;
      }
      clearBtn.disabled = codes.length === 0;
    }

    function ensureColumnChecked(fieldName) {
      const box = document.querySelector(`#columnList input[data-field="${fieldName}"]`);
      if (box && !box.checked) {
        box.checked = true;
        saveColumns(selectedFields());
      }
    }

    function ensureExemptionsColumn() {
      ensureColumnChecked('exemptions');
    }

    function ensureStateCodeColumn() {
      ensureColumnChecked('state_cd');
    }

    function pruneEmptyFilterRows(keepField) {
      [...document.querySelectorAll('#filterList .filter-row')].forEach((row) => {
        const field = row.querySelector('.f-field')?.value;
        const value = row.querySelector('.f-value')?.value;
        const op = row.querySelector('.f-op')?.value;
        const empty =
          !['is_null', 'not_null'].includes(op) && String(value || '').trim() === '';
        if (empty && field !== keepField) row.remove();
      });
    }

    function addExemptionFilter(code) {
      if (!code || selectedExemptionCodes.has(code)) return;
      selectedExemptionCodes.add(code);
      pruneEmptyFilterRows('exemptions');
      addFilterRow({
        field: 'exemptions',
        op: 'has_token',
        value: code,
        fromLegend: 'exemption',
      });
      ensureExemptionsColumn();
      syncLegendActive();
      runSearch(0);
    }

    function clearExemptionFilters() {
      selectedExemptionCodes.clear();
      document.querySelectorAll('#filterList .filter-row[data-from-legend="exemption"]').forEach((row) => {
        row.remove();
      });
      if (![...document.querySelectorAll('#filterList .filter-row')].length) {
        addFilterRow();
      }
      syncLegendActive();
      runSearch(0);
    }

    function rebuildStateCodeFilterRow() {
      document.querySelectorAll('#filterList .filter-row[data-from-legend="state_cd"]').forEach((row) => {
        row.remove();
      });
      const codes = [...selectedStateCodes];
      if (!codes.length) return;
      pruneEmptyFilterRows('state_cd');
      addFilterRow({
        field: 'state_cd',
        op: 'in',
        value: codes.join(','),
        fromLegend: 'state_cd',
      });
      ensureStateCodeColumn();
    }

    function addStateCodeFilter(code) {
      if (!code || selectedStateCodes.has(code)) return;
      selectedStateCodes.add(code);
      rebuildStateCodeFilterRow();
      syncStateLegendActive();
      runSearch(0);
    }

    function clearStateCodeFilters() {
      selectedStateCodes.clear();
      document.querySelectorAll('#filterList .filter-row[data-from-legend="state_cd"]').forEach((row) => {
        row.remove();
      });
      if (![...document.querySelectorAll('#filterList .filter-row')].length) {
        addFilterRow();
      }
      syncStateLegendActive();
      runSearch(0);
    }

    async function init() {
      const me = await PropTaxAuth.requireLogin();
      if (!me) return;
      PropTaxAuth.renderAuthBar(document.getElementById('authBar'), me);
      if (me.user.role === 'ADMIN') {
        document.getElementById('backLink').href = `/c/${STATE}/${COUNTY}/`;
        document.getElementById('backLink').textContent = '← County portal';
      }

      const [fieldsRes, statsRes] = await Promise.all([
        PropTaxAuth.authFetch(`${API}/browse/fields`),
        PropTaxAuth.authFetch(`${API}/stats`),
      ]);
      if (statsRes.status === 403 || fieldsRes.status === 403) {
        showError('You do not have access to this county. Request access from the state page.');
        setTimeout(() => {
          window.location.href = `/state.html?state=${STATE.toUpperCase()}`;
        }, 2000);
        return;
      }
      const fieldsData = await fieldsRes.json();
      fieldMeta = fieldsData.fields || [];
      const stats = await statsRes.json().catch(() => ({}));
      if (stats.version) document.getElementById('version').textContent = `v${stats.version}`;
      if (stats.countyName) {
        document.getElementById('pageTitle').innerHTML =
          `Browse ${escapeHtml(stats.countyName)} <span id="version" style="color:#8b949e;font-size:0.85rem;font-weight:400;">${stats.version ? `v${escapeHtml(stats.version)}` : ''}</span>`;
        document.title = `Browse — ${stats.countyName}`;
      }

      renderExemptionLegend();
      renderStateCodeLegend();
      renderColumns();
      addFilterRow();
      runSearch(0);
    }

    function renderColumns() {
      const saved = loadSavedColumns();
      const box = document.getElementById('columnList');
      box.innerHTML = fieldMeta.map((f) => {
        const checked = saved
          ? saved.includes(f.name)
          : f.defaultVisible;
        return `<label><input type="checkbox" data-field="${escapeHtml(f.name)}" ${checked ? 'checked' : ''}/> ${escapeHtml(f.label)}</label>`;
      }).join('');
      box.querySelectorAll('input[type=checkbox]').forEach((el) => {
        el.addEventListener('change', () => saveColumns(selectedFields()));
      });
    }

    function safeParse(s) {
      try { return s ? JSON.parse(s) : null; } catch { return null; }
    }

    function selectedFields() {
      return [...document.querySelectorAll('#columnList input[type=checkbox]:checked')]
        .map((el) => el.getAttribute('data-field'));
    }

    function selectDefaultColumns() {
      document.querySelectorAll('#columnList input[type=checkbox]').forEach((el) => {
        const meta = fieldMeta.find((f) => f.name === el.getAttribute('data-field'));
        el.checked = Boolean(meta?.defaultVisible);
      });
      saveColumns(selectedFields());
    }

    function selectAllColumns(on) {
      document.querySelectorAll('#columnList input[type=checkbox]').forEach((el) => {
        el.checked = on;
      });
      saveColumns(selectedFields());
    }

    function fieldOptionsHtml(selected) {
      return fieldMeta.map((f) =>
        `<option value="${escapeHtml(f.name)}" ${f.name === selected ? 'selected' : ''}>${escapeHtml(f.label)}</option>`
      ).join('');
    }

    function opOptionsHtml(selected) {
      return OPS.map((o) =>
        `<option value="${o.value}" ${o.value === selected ? 'selected' : ''}>${o.label}</option>`
      ).join('');
    }

    function addFilterRow(preset = {}) {
      const wrap = document.getElementById('filterList');
      const row = document.createElement('div');
      row.className = 'filter-row';
      if (preset.fromLegend === 'exemption') {
        row.dataset.fromLegend = 'exemption';
        row.dataset.exemptionCode = String(preset.value || '');
      } else if (preset.fromLegend === 'state_cd') {
        row.dataset.fromLegend = 'state_cd';
      }
      const field = preset.field || 'owner_name';
      const op = preset.op || 'ilike';
      const value = preset.value ?? '';
      row.innerHTML = `
        <select class="f-field">${fieldOptionsHtml(field)}</select>
        <div class="row2">
          <select class="f-op">${opOptionsHtml(op)}</select>
          <input class="f-value" type="text" placeholder="value" value="${escapeHtml(value)}" />
          <button type="button" class="danger" title="Remove">✕</button>
        </div>
      `;
      row.querySelector('button').onclick = () => {
        const legend = row.dataset.fromLegend;
        if (legend === 'exemption') {
          const code = row.dataset.exemptionCode;
          if (code) selectedExemptionCodes.delete(code);
          row.remove();
          syncLegendActive();
        } else if (legend === 'state_cd') {
          selectedStateCodes.clear();
          row.remove();
          syncStateLegendActive();
        } else {
          row.remove();
        }
      };
      const opEl = row.querySelector('.f-op');
      const valEl = row.querySelector('.f-value');
      const syncValueEnabled = () => {
        const needsValue = !['is_null', 'not_null'].includes(opEl.value);
        valEl.disabled = !needsValue;
        if (!needsValue) valEl.value = '';
      };
      opEl.onchange = syncValueEnabled;
      syncValueEnabled();
      wrap.appendChild(row);
    }

    function clearFilters() {
      selectedExemptionCodes.clear();
      selectedStateCodes.clear();
      document.getElementById('filterList').innerHTML = '';
      addFilterRow();
      syncLegendActive();
      syncStateLegendActive();
    }

    function collectFilters() {
      return [...document.querySelectorAll('#filterList .filter-row')].map((row) => {
        const field = row.querySelector('.f-field').value;
        const op = row.querySelector('.f-op').value;
        const value = row.querySelector('.f-value').value;
        return { field, op, value };
      }).filter((f) => f.op === 'is_null' || f.op === 'not_null' || String(f.value || '').trim() !== '');
    }

    function showError(msg) {
      const el = document.getElementById('error');
      if (!msg) {
        el.style.display = 'none';
        el.textContent = '';
        return;
      }
      el.style.display = 'block';
      el.textContent = msg;
    }

    async function runSearch(newOffset = 0) {
      showError('');
      offset = Math.max(0, newOffset);
      const fields = selectedFields();
      if (!fields.length) {
        showError('Select at least one column.');
        return;
      }
      saveColumns(fields);
      lastFields = fields;
      const limit = Number(document.getElementById('pageSize').value) || 50;
      // Clamp client-side to match server max (1000)
      const safeLimit = Math.min(Math.max(limit, 1), 1000);
      if (safeLimit !== limit) {
        document.getElementById('pageSize').value = String(safeLimit);
      }

      try {
        const res = await PropTaxAuth.authFetch(`${API}/browse/properties`, {
          method: 'POST',
          body: JSON.stringify({
            fields,
            filters: collectFilters(),
            limit: safeLimit,
            offset,
            sort,
            order,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Search failed');
        total = data.total || 0;
        renderTable(data.fields || fields, data.rows || []);
        document.getElementById('shownCount').textContent = String((data.rows || []).length);
        document.getElementById('totalCount').textContent = String(total);
        const page = Math.floor(offset / safeLimit) + 1;
        const pages = Math.max(1, Math.ceil(total / safeLimit));
        document.getElementById('pageInfo').textContent = `Page ${page} / ${pages}`;
        document.getElementById('btnPrev').disabled = offset <= 0;
        document.getElementById('btnNext').disabled = offset + safeLimit >= total;
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    function renderTable(fields, rows) {
      const thead = document.getElementById('thead');
      const tbody = document.getElementById('tbody');
      thead.innerHTML = `<tr>${fields.map((f) => {
        const meta = fieldMeta.find((x) => x.name === f);
        const label = meta?.label || f;
        const marker = sort === f ? (order === 'asc' ? ' ▲' : ' ▼') : '';
        return `<th data-sort="${escapeHtml(f)}">${escapeHtml(label)}${marker}</th>`;
      }).join('')}</tr>`;

      thead.querySelectorAll('th').forEach((th) => {
        th.onclick = () => {
          const col = th.getAttribute('data-sort');
          if (sort === col) order = order === 'asc' ? 'desc' : 'asc';
          else { sort = col; order = 'asc'; }
          runSearch(0);
        };
      });

      if (!rows.length) {
        tbody.innerHTML = `<tr><td class="empty" colspan="${fields.length}">No matching records.</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map((row) => {
        return `<tr>${fields.map((f) => {
          const v = row[f];
          const text = v == null ? '' : String(v);
          const cls = ['legal_desc', 'situs', 'jurisdictions', 'owner_name'].includes(f) ? 'wrap' : '';
          let cell = escapeHtml(text);
          if (f === 'situs' && text.trim()) {
            const mapUrl = googleMapsUrl(text);
            cell = `<a class="map-link" href="${escapeHtml(mapUrl)}" target="_blank" rel="noopener noreferrer" title="Open in Google Maps">${escapeHtml(text)}</a>`;
          }
          return `<td class="${cls}" title="${escapeHtml(text)}">${cell}</td>`;
        }).join('')}</tr>`;
      }).join('');
    }

    function googleMapsUrl(address) {
      const q = String(address).trim();
      // Prefer Bexar County context when the situs string has no city/state.
      const query = /,\s*(TX|Texas)\b/i.test(q) || /\bSan Antonio\b/i.test(q)
        ? q
        : `${q}, San Antonio, TX`;
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    function prevPage() {
      const limit = Number(document.getElementById('pageSize').value) || 50;
      runSearch(Math.max(0, offset - limit));
    }

    function nextPage() {
      const limit = Number(document.getElementById('pageSize').value) || 50;
      runSearch(offset + limit);
    }

    document.getElementById('pageSize').addEventListener('change', () => {
      runSearch(0);
    });

    init();
  </script>
</body>
</html>
