<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bexar CAD Portal</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    :root {
      --bg: #0c1014;
      --panel: #121820;
      --border: #2a3544;
      --text: #e8edf2;
      --muted: #8b9aab;
      --accent: #6ec9a8;
      --nav-w: 240px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem 0 1.1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      z-index: 20;
    }
    .brand-wrap { display: flex; align-items: baseline; gap: 0.65rem; }
    .brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    .version {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .user-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .user-meta button {
      background: #1a2330;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .user-meta button:hover { border-color: var(--accent); }
    .shell {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .sidebar {
      width: var(--nav-w);
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .nav-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.35rem 0.7rem 0.55rem;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
    .nav-item:hover { background: #1a2330; }
    .nav-item.active {
      background: #16352c;
      border-color: #2d5c4a;
      color: var(--accent);
      font-weight: 600;
    }
    .main {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .page-title {
      position: absolute;
      top: 0.75rem;
      left: 0.85rem;
      z-index: 10;
      background: rgba(18, 24, 32, 0.88);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      pointer-events: none;
    }
    .page-title strong { color: var(--accent); font-weight: 650; }
    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }
    .status-pill {
      position: absolute;
      bottom: 1rem;
      left: 0.85rem;
      z-index: 10;
      background: rgba(18, 24, 32, 0.9);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .basemap-control {
      position: absolute;
      bottom: 1rem;
      right: 0.85rem;
      z-index: 10;
      display: flex;
      gap: 0;
      background: rgba(18, 24, 32, 0.92);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .basemap-control button {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
    }
    .basemap-control button + button {
      border-left: 1px solid var(--border);
    }
    .basemap-control button.active {
      background: #16352c;
      color: var(--accent);
    }
    .basemap-control button:hover:not(.active) {
      background: #1a2330;
    }
    .maplibregl-popup-content {
      background: #121820 !important;
      color: #e8edf2 !important;
      border: 1px solid #2a3544;
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
      font-size: 0.85rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
      border-top-color: #121820 !important;
    }
    .popup-row { margin: 0.15rem 0; }
    .popup-row span { color: #8b9aab; }
    .popup-row a { color: var(--accent); }
    .map-layers {
      position: absolute;
      top: 0.75rem;
      right: 3.25rem;
      z-index: 10;
      background: rgba(18, 24, 32, 0.92);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      font-size: 0.8rem;
      min-width: 11rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .map-layers label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      color: var(--text);
      user-select: none;
    }
    .map-layers label + label {
      margin-top: 0.4rem;
    }
    .map-layers .hint {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.3;
    }
    .tier-dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .tier-dot.hot { background: #f07178; }
    .tier-dot.warm { background: #e5c07b; }
    .tier-dot.watch { background: #61afef; }
    @media (max-width: 720px) {
      .sidebar { width: 56px; padding: 0.5rem; }
      .nav-label, .nav-item .full { display: none; }
      .nav-item { text-align: center; padding: 0.65rem; font-size: 0.75rem; }
      .map-layers { right: 0.85rem; top: 3.4rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand">Bexar CAD Portal</div>
      <div class="version" id="version"></div>
    </div>
    <div class="user-meta" id="userMeta"></div>
  </header>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="nav-label">Maps</div>
      <a class="nav-item active" href="/">Bexar Property Map</a>
      <div class="nav-label">Leads</div>
      <a class="nav-item" href="/va.html">VA Opportunities</a>
      <a class="nav-item" href="/leads.html">My Leads</a>
      <div class="nav-label">Data</div>
      <a class="nav-item" href="/data.html">Browse</a>
      <a class="nav-item" href="/geocode.html">Geocode</a>
      <a class="nav-item" href="/import.html">Import</a>
      <div class="nav-label admin-only" id="adminSection" style="display:none">Admin</div>
      <a class="nav-item admin-only" id="usersLink" href="/users.html" style="display:none">Users</a>
    </nav>
    <main class="main">
      <div class="page-title"><strong>Bexar Property Map</strong> — parcels + VA opportunities</div>
      <div id="map"></div>
      <div class="map-layers" id="mapLayers">
        <label>
          <input type="checkbox" id="toggleParcels">
          Lot lines
        </label>
        <label>
          <input type="checkbox" id="toggleVa" checked>
          VA opportunities
        </label>
        <div class="hint" id="vaHint">
          <span class="tier-dot hot"></span> hot
          <span class="tier-dot warm" style="margin-left:0.4rem"></span> warm
          <span class="tier-dot watch" style="margin-left:0.4rem"></span> watch
        </div>
      </div>
      <div class="status-pill" id="status">Loading parcels…</div>
      <div class="basemap-control" role="group" aria-label="Basemap">
        <button type="button" class="active" data-basemap="street" id="btnStreet">Street map</button>
        <button type="button" data-basemap="satellite" id="btnSat">Satellite</button>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/auth.js"></script>
  <script>
    (async function () {
      const me = await PortalAuth.requireLogin();
      if (!me) return;

      const verEl = document.getElementById("version");
      const userMeta = document.getElementById("userMeta");
      const statusEl = document.getElementById("status");

      try {
        const vRes = await fetch("/api/version");
        const v = await vRes.json();
        verEl.textContent = "v" + (v.version || "");
      } catch { /* ignore */ }

      userMeta.innerHTML = `
        <span>${PortalAuth.escapeHtml(PortalAuth.displayName(me.user))}
          <span style="opacity:0.7">(${PortalAuth.escapeHtml(me.user.role)})</span>
        </span>
        <button type="button" id="logoutBtn">Logout</button>`;
      document.getElementById("logoutBtn").addEventListener("click", PortalAuth.logout);

      if (me.user.role === "ADMIN") {
        document.getElementById("adminSection").style.display = "";
        document.getElementById("usersLink").style.display = "";
      }

      const token = PortalAuth.getToken();
      let parcelCount = 0;
      let bounds = null;
      try {
        const st = await PortalAuth.authFetch("/api/bcad/status");
        const data = await st.json();
        if (st.ok) {
          parcelCount = data.count || 0;
          bounds = data.bounds;
          statusEl.textContent = parcelCount
            ? `${parcelCount.toLocaleString()} parcels loaded`
            : "No parcels in bcad_properties — run import script";
        } else {
          statusEl.textContent = data.error || "Status failed";
        }
      } catch (e) {
        statusEl.textContent = e.message || "Status error";
      }

      // Bexar County approx center — Street (OSM) + Esri World Imagery (same as Police Calls admin)
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
          sources: {
            osm: {
              type: "raster",
              tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
              attribution: "© OpenStreetMap",
              maxzoom: 19,
            },
            satellite: {
              type: "raster",
              // Esri World Imagery — {z}/{y}/{x} order (same URL as sapd entity-map-basemap.js)
              tiles: [
                "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
              ],
              tileSize: 256,
              attribution:
                "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
              maxzoom: 19,
            },
          },
          layers: [
            {
              id: "basemap-osm",
              type: "raster",
              source: "osm",
              layout: { visibility: "visible" },
            },
            {
              id: "basemap-satellite",
              type: "raster",
              source: "satellite",
              layout: { visibility: "none" },
            },
          ],
        },
        center: [-98.4936, 29.4241],
        zoom: 10,
      });
      map.addControl(new maplibregl.NavigationControl(), "top-right");

      function setBasemap(mode) {
        const street = mode === "street";
        map.setLayoutProperty(
          "basemap-osm",
          "visibility",
          street ? "visible" : "none"
        );
        map.setLayoutProperty(
          "basemap-satellite",
          "visibility",
          street ? "none" : "visible"
        );
        // Parcel outlines: darker on street, light on satellite
        if (map.getLayer("bcad-outline")) {
          map.setPaintProperty(
            "bcad-outline",
            "line-color",
            street ? "#1a3a2f" : "#f0f4f2"
          );
          map.setPaintProperty(
            "bcad-fill",
            "fill-opacity",
            street ? 0.08 : 0.12
          );
          map.setPaintProperty(
            "bcad-fill",
            "fill-color",
            street ? "#6ec9a8" : "#6ec9a8"
          );
        }
        document.getElementById("btnStreet").classList.toggle("active", street);
        document.getElementById("btnSat").classList.toggle("active", !street);
      }
      document.getElementById("btnStreet").addEventListener("click", () => setBasemap("street"));
      document.getElementById("btnSat").addEventListener("click", () => setBasemap("satellite"));

      map.on("load", () => {
        const popup = new maplibregl.Popup({
          closeButton: true,
          closeOnClick: true,
          maxWidth: "280px",
        });

        let parcelsLoaded = false;
        let parcelHandlersBound = false;
        const PARCEL_LAYERS = ["bcad-fill", "bcad-outline", "bcad-outline-hi"];

        function ensureParcelsLoaded() {
          if (parcelsLoaded) return;
          parcelsLoaded = true;
          map.addSource("bcad-parcels", {
            type: "vector",
            tiles: [
              `${location.origin}/api/bcad/tiles/{z}/{x}/{y}.mvt?token=${encodeURIComponent(token)}`,
            ],
            minzoom: 8,
            maxzoom: 16,
          });

          // Insert under VA layers so markers stay on top
          const beforeId = map.getLayer("va-clusters")
            ? "va-clusters"
            : map.getLayer("va-unclustered")
              ? "va-unclustered"
              : undefined;

          map.addLayer(
            {
              id: "bcad-fill",
              type: "fill",
              source: "bcad-parcels",
              "source-layer": "parcels",
              paint: {
                "fill-color": "#6ec9a8",
                "fill-opacity": 0.08,
              },
            },
            beforeId
          );

          map.addLayer(
            {
              id: "bcad-outline",
              type: "line",
              source: "bcad-parcels",
              "source-layer": "parcels",
              paint: {
                "line-color": "#1a3a2f",
                "line-width": [
                  "interpolate", ["linear"], ["zoom"],
                  8, 0.2,
                  12, 0.6,
                  15, 1.1,
                  17, 1.6
                ],
                "line-opacity": 0.9,
              },
            },
            beforeId
          );

          map.addLayer(
            {
              id: "bcad-outline-hi",
              type: "line",
              source: "bcad-parcels",
              "source-layer": "parcels",
              paint: {
                "line-color": "#6ec9a8",
                "line-width": 2,
                "line-opacity": 1,
              },
              filter: ["==", ["id"], -1],
            },
            beforeId
          );

          if (!parcelHandlersBound) {
            parcelHandlersBound = true;
            map.on("mousemove", "bcad-fill", (e) => {
              if (!document.getElementById("toggleParcels").checked) return;
              map.getCanvas().style.cursor = "pointer";
              if (e.features?.[0]) {
                map.setFilter("bcad-outline-hi", [
                  "==",
                  ["get", "id"],
                  e.features[0].properties.id,
                ]);
              }
            });
            map.on("mouseleave", "bcad-fill", () => {
              map.getCanvas().style.cursor = "";
              if (map.getLayer("bcad-outline-hi")) {
                map.setFilter("bcad-outline-hi", ["==", ["get", "id"], -1]);
              }
            });
            map.on("click", "bcad-fill", (e) => {
              if (!document.getElementById("toggleParcels").checked) return;
              const f = e.features?.[0];
              if (!f) return;
              const p = f.properties || {};
              const html = `
                <div class="popup-row"><span>Owner</span><br>${PortalAuth.escapeHtml(p.owner_name || "—")}</div>
                <div class="popup-row"><span>Situs</span><br>${PortalAuth.escapeHtml(p.situs || "—")}</div>
                <div class="popup-row"><span>Appraised</span><br>${PortalAuth.escapeHtml(p.appraised_val || "—")}</div>
                <div class="popup-row"><span>Prop ID</span><br>${PortalAuth.escapeHtml(p.pacs_prop_id || "—")}</div>
              `;
              popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
            });
          }
        }

        function setParcelsVisible(on) {
          if (on) ensureParcelsLoaded();
          const vis = on ? "visible" : "none";
          for (const id of PARCEL_LAYERS) {
            if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", vis);
          }
          if (!on) {
            map.getCanvas().style.cursor = "";
            if (map.getLayer("bcad-outline-hi")) {
              map.setFilter("bcad-outline-hi", ["==", ["get", "id"], -1]);
            }
          }
        }

        document.getElementById("toggleParcels").addEventListener("change", (ev) => {
          setParcelsVisible(ev.target.checked);
        });
        // Lot lines default OFF — do not load MVT until toggled on
        setParcelsVisible(false);

        if (bounds && bounds[0] && bounds[1]) {
          map.fitBounds(
            [
              [bounds[0][0], bounds[0][1]],
              [bounds[1][0], bounds[1][1]],
            ],
            { padding: 40, maxZoom: 12 }
          );
        }

        // VA opportunity clusters first (no parcel tile competition)
        async function loadVaClusters() {
          statusEl.textContent = "Loading VA markers…";
          try {
            const res = await PortalAuth.authFetch(
              "/api/bcad/va-opportunities/geojson?min_score=0"
            );
            const fc = await res.json();
            if (!res.ok) throw new Error(fc.error || "VA geojson failed");
            const n = (fc.features || []).length;
            if (!n) {
              statusEl.textContent =
                (parcelCount ? `${parcelCount.toLocaleString()} parcels` : "Map ready") +
                " · no VA markers yet";
              document.getElementById("vaHint").textContent =
                "No geocoded VA points yet — run Geocode";
              return;
            }

            if (map.getSource("va-opps")) {
              map.getSource("va-opps").setData(fc);
            } else {
              map.addSource("va-opps", {
                type: "geojson",
                data: fc,
                cluster: true,
                clusterMaxZoom: 16,
                clusterRadius: 70,
                clusterMinPoints: 2,
              });
            }

            if (!map.getLayer("va-clusters")) {
              map.addLayer({
                id: "va-clusters",
                type: "circle",
                source: "va-opps",
                filter: ["has", "point_count"],
                paint: {
                  "circle-color": [
                    "step",
                    ["get", "point_count"],
                    "#3d6b8a",
                    10,
                    "#2f6b58",
                    50,
                    "#8a5a2b",
                    150,
                    "#8a3a42",
                    500,
                    "#6b2d8a",
                  ],
                  "circle-radius": [
                    "step",
                    ["get", "point_count"],
                    18,
                    10,
                    22,
                    50,
                    28,
                    150,
                    34,
                    500,
                    42,
                  ],
                  "circle-opacity": 0.92,
                  "circle-stroke-width": 1.5,
                  "circle-stroke-color": "#0c1014",
                },
              });

              map.addLayer({
                id: "va-cluster-count",
                type: "symbol",
                source: "va-opps",
                filter: ["has", "point_count"],
                layout: {
                  "text-field": ["to-string", ["get", "point_count"]],
                  "text-font": ["Open Sans Bold", "Arial Unicode MS Bold"],
                  "text-size": 12,
                  "text-allow-overlap": true,
                  "text-ignore-placement": true,
                },
                paint: { "text-color": "#e8edf2" },
              });

              map.addLayer({
                id: "va-unclustered",
                type: "circle",
                source: "va-opps",
                filter: ["!", ["has", "point_count"]],
                paint: {
                  "circle-color": [
                    "match",
                    ["get", "tier"],
                    "hot",
                    "#f07178",
                    "warm",
                    "#e5c07b",
                    "#61afef",
                  ],
                  "circle-radius": [
                    "interpolate",
                    ["linear"],
                    ["zoom"],
                    7,
                    3.5,
                    10,
                    5,
                    14,
                    8,
                    17,
                    11,
                  ],
                  "circle-stroke-width": 1.25,
                  "circle-stroke-color": "#0c1014",
                  "circle-opacity": 0.95,
                },
              });

              map.on("click", "va-clusters", async (e) => {
                const features = map.queryRenderedFeatures(e.point, {
                  layers: ["va-clusters"],
                });
                const clusterId = features[0]?.properties?.cluster_id;
                const source = map.getSource("va-opps");
                if (clusterId == null || !source) return;
                try {
                  const zoom = await source.getClusterExpansionZoom(clusterId);
                  map.easeTo({
                    center: features[0].geometry.coordinates,
                    zoom: Math.min(Math.max(zoom, map.getZoom() + 1.2), 18),
                  });
                } catch {
                  map.easeTo({
                    center: features[0].geometry.coordinates,
                    zoom: Math.min(map.getZoom() + 2, 18),
                  });
                }
              });

              map.on("click", "va-unclustered", (e) => {
                const f = e.features?.[0];
                if (!f) return;
                const p = f.properties || {};
                const coords = f.geometry.coordinates.slice();
                const html = `
                  <div class="popup-row"><span>VA ${PortalAuth.escapeHtml(p.tier || "—")}</span>
                    · score ${PortalAuth.escapeHtml(String(p.score ?? "—"))}</div>
                  <div class="popup-row"><span>Owner</span><br>
                    <a href="/property.html?id=${encodeURIComponent(p.id)}">${PortalAuth.escapeHtml(p.owner_name || "Property #" + p.id)}</a>
                  </div>
                  <div class="popup-row"><span>Situs</span><br>${PortalAuth.escapeHtml(p.situs || "—")}</div>
                  <div class="popup-row"><span>Exemptions</span><br>${PortalAuth.escapeHtml(p.exemptions || "—")}</div>
                `;
                popup.setLngLat(coords).setHTML(html).addTo(map);
              });

              for (const layerId of ["va-clusters", "va-unclustered"]) {
                map.on("mouseenter", layerId, () => {
                  map.getCanvas().style.cursor = "pointer";
                });
                map.on("mouseleave", layerId, () => {
                  map.getCanvas().style.cursor = "";
                });
              }

              document.getElementById("toggleVa").addEventListener("change", (ev) => {
                const vis = ev.target.checked ? "visible" : "none";
                for (const id of ["va-clusters", "va-cluster-count", "va-unclustered"]) {
                  if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", vis);
                }
              });
            }

            statusEl.textContent = `${n.toLocaleString()} VA markers (clustered)`;
          } catch (err) {
            console.warn("VA clusters:", err);
            statusEl.textContent = "VA markers failed to load";
            document.getElementById("vaHint").textContent =
              "VA layer unavailable: " + (err.message || "error");
          }
        }

        loadVaClusters();
      });
    })();
