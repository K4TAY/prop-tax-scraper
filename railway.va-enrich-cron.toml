# Railway cron service: enrich one high-score VA opportunity every 10 minutes.
# Create a separate service (e.g. va-enrich-cron) pointing at this repo with:
#   Config file path: railway.va-enrich-cron.toml
# Shares BCAD_DATABASE_URL (PostGIS) with bcad-portal.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "bun scripts/cron-enrich-va-opportunity.js --min-score=50"
cronSchedule = "*/10 * * * *"
restartPolicyType = "NEVER"
